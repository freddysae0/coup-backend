name: Test and deploy

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  test:
    name: Lint and Test (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (rules, fuzzing, WebSocket simulations)
        run: npm test

  deploy:
    name: Deploy on Ploi (CD)
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Ploi pulls the repo and runs `docker compose up -d --build` on the
      # server (see "Deploy on Ploi" in readme.md). Deploying from here instead
      # of Ploi's quick deploy means a red build never reaches production.
      - name: Trigger Ploi deployment
        run: |
          if [ -z "$PLOI_DEPLOY_WEBHOOK" ]; then
            echo "::warning::PLOI_DEPLOY_WEBHOOK is not set, skipping deploy"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$PLOI_DEPLOY_WEBHOOK"
        env:
          PLOI_DEPLOY_WEBHOOK: ${{ secrets.PLOI_DEPLOY_WEBHOOK }}
